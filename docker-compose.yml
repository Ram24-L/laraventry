services:
  web:
    build : .
    container_name: laraventry-web
    ports:
      - "8080:8080"
    volumes:
      - ./:/var/www/html
    environment:
      - AUTORUN_LARAVEL_MIGRATION=false
    restart: always
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: laraventry-db
    environment:
      MYSQL_DATABASE: laraventry
      MYSQL_ROOT_PASSWORD: password_rahasia
      MYSQL_USER: laraventry_user
      MYSQL_PASSWORD: password_rahasia
    ports:
      - "3306:3306"
    volumes:
      - laraventry_db:/var/lib/mysql
    restart: always

volumes:
  laraventry_db:
